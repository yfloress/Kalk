<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Mortarboard (graduation cap) -->
  <g transform="translate(64,48)">
    <!-- Cap top -->
    <polygon points="-38,-6 0,-28 38,-6" fill="#cba6f7" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Cap brim -->
    <rect x="-44" y="-6" width="88" height="6" rx="2" fill="#b4befe"/>
    <!-- Tassel -->
    <line x1="30" y1="-20" x2="44" y2="4" stroke="#f9e2af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="44" cy="4" r="3" fill="#f9e2af"/>
  </g>
  <!-- K letter -->
  <text x="64" y="104" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#cdd6f4">K</text>
</svg>

# Policy for `cargo deny check`, run by the CI workflow.
#
# Only the settings that differ from cargo-deny's defaults are kept here; the
# full annotated template is at
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# RustSec advisories are always an error. Anything we knowingly accept goes
# here with the reason spelled out, never silently.
ignore = []

[licenses]
# Kalk ships under AGPL-3.0-or-later, so every dependency has to be compatible
# with distributing it. Permissive licences, plus MPL-2.0 (see below).
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    # MPL-2.0 is file-level copyleft, not permissive, and is allowed on
    # purpose: its own section 1.12 names AGPL-3.0 a "Secondary License", and
    # section 3.3 permits distributing a Larger Work that combines the two.
    # That only holds while the crate is not marked "Incompatible With
    # Secondary Licenses" (Exhibit B) — option-ext, the crate that brings this
    # in through directories -> dirs-sys, carries no such notice.
    # Re-check the notice if another MPL crate ever appears here.
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicated versions are noise, not a defect: they usually come from a
# transitive dependency we do not control.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
